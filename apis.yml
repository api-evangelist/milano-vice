name: Milano Vice
description: >-
  Milano Vice is a Berlin-based virtual restaurant company founded in 2021 by
  Rudolf Donauer and Dennis Murselovic (both ex-Delivery Hero) that operates a
  digitally-powered, delivery-first pizza brand. It partners with professional
  kitchens across German cities including Berlin, Cologne, Hamburg and
  Frankfurt to prepare and deliver handmade pizzas and pinsa to homes and
  offices, orderable through its own website and third-party delivery
  platforms such as Lieferando, Wolt and Uber Eats. It is a consumer food
  brand backed by Speedinvest, Coefficient Capital, True and Geschwister
  Oetker, and does not currently publish a public developer API surface. This
  profile was added to the API Evangelist network as a portfolio-lead stub.
